name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: web — typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyhaven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skyhaven/.nvmrc
          cache: npm
          cache-dependency-path: skyhaven/package-lock.json
      - name: Install
        run: npm ci --workspaces --include-workspace-root
      - name: Typecheck
        run: npm run typecheck -w app
      - name: Test
        run: npm run test -w app
      - name: Build
        run: npm run build -w app

  android-debug:
    name: android — debug AAB
    needs: web
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: skyhaven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skyhaven/.nvmrc
          cache: npm
          cache-dependency-path: skyhaven/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JS deps
        run: npm ci --workspaces --include-workspace-root
      - name: Build web
        run: npm run build -w app
      - name: Skip android — not yet generated
        if: ${{ hashFiles('skyhaven/android/gradlew') == '' }}
        run: echo "android/ not yet generated. Run 'npx cap add android' locally and commit."
      - name: Capacitor sync
        if: ${{ hashFiles('skyhaven/android/gradlew') != '' }}
        run: npx cap sync android
      - name: Gradle bundleDebug
        if: ${{ hashFiles('skyhaven/android/gradlew') != '' }}
        working-directory: skyhaven/android
        run: ./gradlew bundleDebug --no-daemon
      - name: Upload debug AAB
        if: ${{ hashFiles('skyhaven/android/gradlew') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: skyhaven-debug-aab
          path: skyhaven/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: warn
