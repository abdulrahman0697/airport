name: Deploy Firebase

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from the GitHub Actions UI for in-development phase
  # iteration (Phase 12+). Tag-based deploys remain the canonical
  # release flow.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyhaven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skyhaven/.nvmrc
      - name: Install root + functions
        run: |
          npm ci --workspaces --include-workspace-root
          (cd functions && npm ci && npm run build)
      - name: Auth to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret — skipping deploy."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> $GITHUB_ENV
      - name: Deploy Firestore rules + Remote Config + Functions
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          # --force auto-accepts the Cloud Build artifact cleanup policy
          # prompt that the Firebase CLI added in 13.x. Without it the
          # CLI deploys functions successfully but exits non-zero
          # waiting for interactive input. The policy itself just
          # garbage-collects old container images so we don't pay for
          # storing every historical build.
          npx firebase-tools deploy \
            --only firestore:rules,remoteconfig,functions \
            --force \
            --non-interactive \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"
