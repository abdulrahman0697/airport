name: Deploy Firebase

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyhaven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skyhaven/.nvmrc
      - name: Install root + functions
        run: |
          npm ci --workspaces --include-workspace-root
          (cd functions && npm ci && npm run build)
      - name: Auth to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret — skipping deploy."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> $GITHUB_ENV
      - name: Deploy Firestore rules + Remote Config + Functions
        if: env.GOOGLE_APPLICATION_CREDENTIALS != ''
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,remoteconfig,functions \
            --non-interactive \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"
